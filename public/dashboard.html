<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Camp Simcha">
<meta name="format-detection" content="telephone=no">
<title>Camp Simcha — Dashboard</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    background: #fff;
    color: #222;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 15px;
    padding-bottom: 120px; /* room for the fixed action bar */
    overscroll-behavior-y: contain;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }

  header {
    position: sticky;
    top: 0;
    z-index: 10;
    background: #fff;
    padding: max(10px, env(safe-area-inset-top)) 14px 8px;
    border-bottom: 1px solid #ddd;
  }
  header .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }
  header h1 { font-size: 16px; font-weight: 700; }

  #conn {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: #666;
    white-space: nowrap;
  }
  #conn .dot { width: 8px; height: 8px; border-radius: 50%; background: #c33; }
  #conn.online .dot { background: #2a8a3e; }

  #screens {
    margin-top: 4px;
    font-size: 12.5px;
    color: #666;
  }
  #screens.warn { color: #b32; font-weight: 600; }

  main { padding: 0 14px; max-width: 640px; margin: 0 auto; }

  section { padding: 14px 0; border-bottom: 1px solid #e5e5e5; }
  section:last-of-type { border-bottom: none; }
  h2 {
    font-size: 14px;
    font-weight: 700;
    margin-bottom: 8px;
  }
  h2 .count { font-weight: 400; color: #666; }

  /* Now showing */
  #now-name {
    font-size: 26px;
    font-weight: 700;
    line-height: 1.2;
    overflow-wrap: break-word;
  }
  #now-name.empty { color: #888; font-weight: 400; font-size: 15px; }

  /* Buttons */
  button {
    font: inherit;
    color: #222;
    background: #f2f2f2;
    border: 1px solid #bbb;
    border-radius: 5px;
    padding: 9px 13px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  button:active { background: #e2e2e2; }
  button:disabled { opacity: .45; pointer-events: none; }
  button.small { padding: 6px 10px; font-size: 13px; }
  button.danger { color: #b32; border-color: #c99; }
  button.link {
    background: none;
    border: none;
    color: #1558b0;
    text-decoration: underline;
    padding: 4px 0;
    font-size: 13px;
  }

  /* Add form */
  #add-form { display: flex; gap: 8px; }
  input[type=text], textarea {
    font: inherit;
    font-size: 16px; /* ≥16px so iOS Safari doesn't auto-zoom on focus */
    color: #222;
    background: #fff;
    border: 1px solid #bbb;
    border-radius: 5px;
    padding: 9px 10px;
  }
  #add-input { flex: 1; min-width: 0; }
  #add-form button { font-weight: 600; }

  #bulk-area { display: none; margin-top: 10px; }
  #bulk-area.open { display: block; }
  #bulk-text { width: 100%; height: 110px; resize: vertical; }
  #bulk-area button { margin-top: 8px; font-weight: 600; }

  /* Queue list */
  ul { list-style: none; }
  .item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 0;
    border-bottom: 1px solid #eee;
  }
  .item:last-child { border-bottom: none; }
  .item .pos {
    width: 24px;
    text-align: right;
    color: #888;
    font-size: 13px;
    flex-shrink: 0;
  }
  .item .name {
    flex: 1;
    font-size: 16px;
    overflow-wrap: anywhere;
  }
  .item.next-up .name { font-weight: 700; }
  .item .btns { display: flex; gap: 5px; flex-shrink: 0; }
  .item .btns button { padding: 7px 9px; font-size: 14px; line-height: 1; }

  /* On narrow phones, give the name its own line so it never squeezes;
     buttons drop below with full-size touch targets. */
  @media (max-width: 480px) {
    .item { flex-wrap: wrap; row-gap: 6px; }
    .item .name { flex: 1 1 calc(100% - 40px); }
    .item .btns { margin-left: 34px; }
    .item .btns button { padding: 8px 11px; }
  }

  .empty-note { color: #888; font-size: 14px; padding: 4px 0; }

  /* History */
  .hist-item { display: flex; align-items: center; gap: 10px; padding: 7px 0; border-bottom: 1px solid #eee; }
  .hist-item:last-child { border-bottom: none; }
  .hist-item .name { flex: 1; font-size: 15px; overflow-wrap: anywhere; }
  .hist-item .time { font-size: 12px; color: #888; flex-shrink: 0; }

  /* Settings */
  .field { margin-bottom: 10px; }
  .field label { display: block; font-size: 13px; color: #555; margin-bottom: 4px; }
  .field input[type=text] { width: 100%; }
  .switch { display: flex; align-items: center; gap: 8px; font-size: 15px; }
  .switch input { width: 18px; height: 18px; }

  details > summary {
    cursor: pointer;
    font-size: 14px;
    font-weight: 700;
  }
  details > summary .count { font-weight: 400; color: #666; }
  details[open] > summary { margin-bottom: 8px; }

  /* Fixed action bar */
  #action-bar {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    z-index: 20;
    display: flex;
    gap: 8px;
    padding: 10px 14px calc(10px + env(safe-area-inset-bottom));
    background: #fff;
    border-top: 1px solid #ccc;
  }
  #btn-next {
    flex: 1;
    background: #1558b0;
    border-color: #1558b0;
    color: #fff;
    font-size: 17px;
    font-weight: 700;
    padding: 13px;
  }
  #btn-next:active { background: #114a95; }
  #btn-next small { display: block; font-size: 12px; font-weight: 400; opacity: .85; margin-top: 2px; }
  #btn-prev, #btn-clear { width: 72px; font-size: 12px; }

  #restore-banner {
    display: none;
    margin: 10px 0 0;
    padding: 10px 12px;
    background: #fff8e1;
    border: 1px solid #d9c36a;
    border-radius: 5px;
    font-size: 14px;
    line-height: 1.4;
  }
  #restore-banner.show { display: block; }
  #restore-banner .actions { display: flex; gap: 8px; margin-top: 8px; }
  #restore-banner button { font-size: 13px; padding: 7px 12px; }
  #restore-banner #btn-restore { font-weight: 600; }

  #toast {
    position: fixed;
    left: 50%;
    bottom: 110px;
    transform: translateX(-50%);
    background: #333;
    color: #fff;
    padding: 9px 16px;
    border-radius: 5px;
    font-size: 14px;
    opacity: 0;
    transition: opacity .25s;
    pointer-events: none;
    z-index: 30;
    max-width: 85vw;
    text-align: center;
  }
  #toast.show { opacity: .95; }
</style>
</head>
<body>
  <header>
    <div class="row">
      <h1>Camp Simcha Arrivals</h1>
      <div id="conn"><span class="dot"></span><span id="conn-text">Connecting…</span></div>
    </div>
    <div id="screens">Checking for connected screens…</div>
  </header>

  <main>
    <div id="restore-banner">
      <span id="restore-text"></span>
      <div class="actions">
        <button id="btn-restore" type="button">Restore</button>
        <button id="btn-restore-dismiss" type="button">Dismiss</button>
      </div>
    </div>
    <section>
      <h2>Now on screen</h2>
      <div id="now-name" class="empty">Nothing — screen is on standby</div>
    </section>

    <section>
      <h2>Add names</h2>
      <form id="add-form">
        <input id="add-input" type="text" placeholder="Camper name" autocomplete="off" enterkeyhint="done">
        <button type="submit">Add</button>
      </form>
      <button id="bulk-toggle" type="button" class="link">Paste a whole list…</button>
      <div id="bulk-area">
        <textarea id="bulk-text" placeholder="One name per line:&#10;Moshe Cohen&#10;Dovid Klein&#10;Yanky Friedman"></textarea>
        <button id="bulk-add" type="button">Add all names</button>
      </div>
    </section>

    <section>
      <h2>Up next <span class="count" id="queue-count">(0)</span></h2>
      <ul id="queue"></ul>
      <div class="empty-note" id="queue-empty">No names waiting.</div>
    </section>

    <section>
      <details>
        <summary>Already announced <span class="count" id="hist-count">(0)</span></summary>
        <ul id="history"></ul>
        <div class="empty-note" id="hist-empty">Nobody announced yet.</div>
      </details>
    </section>

    <section>
      <details>
        <summary>Display settings</summary>
        <div class="field">
          <label for="set-title">Title (shown when screen is on standby)</label>
          <input type="text" id="set-title">
        </div>
        <div class="field">
          <label for="set-idle">Standby message (shown under the title)</label>
          <input type="text" id="set-idle">
        </div>
        <div class="field switch">
          <input type="checkbox" id="set-upnext">
          <label for="set-upnext" style="margin:0">Show "Up next" list on the display</label>
        </div>
        <button class="small" id="set-save">Save settings</button>
      </details>
    </section>

    <section>
      <details>
        <summary>Reset</summary>
        <div style="display:flex; gap:8px; flex-wrap:wrap; margin-top:4px;">
          <button class="small danger" id="btn-clear-queue">Clear queue</button>
          <button class="small danger" id="btn-clear-hist">Clear history</button>
          <button class="small danger" id="btn-reset">Reset everything</button>
        </div>
      </details>
    </section>
  </main>

  <div id="action-bar">
    <button id="btn-prev" title="Go back to the previous name">Back</button>
    <button id="btn-next">Announce next<small id="btn-next-sub">queue is empty</small></button>
    <button id="btn-clear" title="Blank the screen">Blank screen</button>
  </div>

  <div id="toast"></div>

<script>
(() => {
  'use strict';

  const $ = (id) => document.getElementById(id);
  let state = null;
  let editingSettings = false;

  // ---- API helpers -----------------------------------------------------------
  async function api(action, params = {}) {
    try {
      const res = await fetch('/api/' + action, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(params),
      });
      if (!res.ok) throw new Error('Request failed');
      return true;
    } catch {
      toast('Could not reach the server — check the connection');
      return false;
    }
  }

  let toastTimer = null;
  function toast(msg) {
    const el = $('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'), 2200);
  }

  const esc = (s) => s.replace(/[&<>"']/g, (c) => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
  }[c]));

  const fmtTime = (ts) => new Date(ts).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });

  // ---- Render ------------------------------------------------------------------
  function render() {
    if (!state) return;

    // Connected screens indicator
    const d = state.clients ? state.clients.displays : 0;
    const screens = $('screens');
    if (d === 0) {
      screens.textContent = 'No display connected — open /display on the stage phone';
      screens.classList.add('warn');
    } else {
      screens.textContent = `${d} display${d > 1 ? 's' : ''} connected`;
      screens.classList.remove('warn');
    }

    // Now showing
    const nowName = $('now-name');
    if (state.current) {
      nowName.textContent = state.current.name;
      nowName.classList.remove('empty');
    } else {
      nowName.textContent = 'Nothing — screen is on standby';
      nowName.classList.add('empty');
    }

    // Queue
    const queueEl = $('queue');
    $('queue-count').textContent = `(${state.queue.length})`;
    $('queue-empty').style.display = state.queue.length ? 'none' : 'block';
    queueEl.innerHTML = state.queue.map((q, i) => `
      <li class="item ${i === 0 ? 'next-up' : ''}" data-id="${q.id}">
        <span class="pos">${i + 1}.</span>
        <span class="name">${esc(q.name)}</span>
        <span class="btns">
          <button class="small" data-act="show" title="Show on screen now">Show</button>
          <button class="small" data-act="up" title="Move up" ${i === 0 ? 'disabled' : ''}>↑</button>
          <button class="small" data-act="down" title="Move down" ${i === state.queue.length - 1 ? 'disabled' : ''}>↓</button>
          <button class="small" data-act="edit" title="Edit">Edit</button>
          <button class="small danger" data-act="remove" title="Remove">✕</button>
        </span>
      </li>`).join('');

    // History (newest first; the top entry may still be on screen)
    const histEl = $('history');
    $('hist-count').textContent = `(${state.announced.length})`;
    $('hist-empty').style.display = state.announced.length ? 'none' : 'block';
    const curId = state.current && state.current.id;
    histEl.innerHTML = state.announced.map((a) => `
      <li class="hist-item" data-id="${a.id}">
        <span class="name">${esc(a.name)}</span>
        <span class="time">${fmtTime(a.at)}${a.id === curId ? ' · on screen' : ''}</span>
        <button class="small" data-act="requeue" title="Announce again">Re-queue</button>
      </li>`).join('');

    // Action bar
    const next = state.queue[0];
    $('btn-next').disabled = !next;
    $('btn-next-sub').textContent = next ? next.name : 'queue is empty';
    $('btn-prev').disabled = state.announced.length === 0;
    $('btn-clear').disabled = !state.current;

    // Settings (don't clobber fields while the user is typing)
    if (!editingSettings) {
      $('set-title').value = state.title;
      $('set-idle').value = state.idleMessage;
      $('set-upnext').checked = state.showUpNext;
    }
  }

  // ---- Local backup: survive a server that lost its state ---------------------
  // Every non-empty state is mirrored to this phone's localStorage. If we ever
  // connect to a server with NO data while a backup exists, offer to restore.
  const BACKUP_KEY = 'camp-simcha-arrivals-backup';
  let restoreDismissed = false;

  function updateBackup() {
    const hasData = state.queue.length || state.announced.length || state.current;
    if (hasData) {
      try {
        localStorage.setItem(BACKUP_KEY, JSON.stringify({
          at: Date.now(),
          queue: state.queue,
          announced: state.announced,
          title: state.title,
          idleMessage: state.idleMessage,
          showUpNext: state.showUpNext,
        }));
      } catch { /* storage full/blocked — backup is best-effort */ }
    }

    const banner = $('restore-banner');
    if (hasData || restoreDismissed) {
      banner.classList.remove('show');
      return;
    }
    let backup = null;
    try { backup = JSON.parse(localStorage.getItem(BACKUP_KEY)); } catch { /* ignore */ }
    if (!backup || (!backup.queue?.length && !backup.announced?.length)) return;
    const when = new Date(backup.at).toLocaleString([], { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
    $('restore-text').textContent =
      `The server has no data, but this phone has a backup from ${when} `
      + `(${backup.queue.length} in queue, ${backup.announced.length} announced).`;
    banner.classList.add('show');
  }

  $('btn-restore').addEventListener('click', async () => {
    let backup = null;
    try { backup = JSON.parse(localStorage.getItem(BACKUP_KEY)); } catch { /* ignore */ }
    if (!backup) return;
    restoreDismissed = true;
    $('restore-banner').classList.remove('show');
    if (await api('restore', backup)) toast('List restored');
  });
  $('btn-restore-dismiss').addEventListener('click', () => {
    restoreDismissed = true;
    $('restore-banner').classList.remove('show');
  });

  // ---- Live connection -------------------------------------------------------------
  let es = null;
  let retryDelay = 1000;

  function setConn(online) {
    $('conn').classList.toggle('online', online);
    $('conn-text').textContent = online ? 'Live' : 'Reconnecting…';
  }

  function connect() {
    es = new EventSource('/events?role=dashboard');
    es.onopen = () => { retryDelay = 1000; setConn(true); };
    es.onmessage = (e) => { state = JSON.parse(e.data); render(); updateBackup(); };
    es.onerror = () => {
      setConn(false);
      es.close();
      setTimeout(connect, retryDelay);
      retryDelay = Math.min(retryDelay * 2, 15000);
    };
  }
  connect();

  // iOS Safari silently kills SSE connections in the background —
  // reconnect fresh whenever the page becomes visible again.
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && es) {
      es.onerror = null;
      es.close();
      retryDelay = 1000;
      connect();
    }
  });

  // ---- Add names ----------------------------------------------------------------
  $('add-form').addEventListener('submit', (e) => {
    e.preventDefault();
    const input = $('add-input');
    const name = input.value.trim();
    if (!name) return;
    api('add', { names: [name] });
    input.value = '';
    input.focus();
  });

  $('bulk-toggle').addEventListener('click', () => {
    $('bulk-area').classList.toggle('open');
    if ($('bulk-area').classList.contains('open')) $('bulk-text').focus();
  });

  $('bulk-add').addEventListener('click', async () => {
    const names = $('bulk-text').value
      .split(/\r?\n/)
      .map((s) => s.trim())
      .filter(Boolean);
    if (!names.length) return;
    if (await api('add', { names })) {
      $('bulk-text').value = '';
      $('bulk-area').classList.remove('open');
      toast(`Added ${names.length} name${names.length > 1 ? 's' : ''}`);
    }
  });

  // ---- Queue & history item buttons (event delegation) -----------------------------
  document.querySelector('main').addEventListener('click', (e) => {
    const btn = e.target.closest('button[data-act]');
    if (!btn) return;
    const id = btn.closest('[data-id]').dataset.id;
    const act = btn.dataset.act;

    if (act === 'up' || act === 'down') api('move', { id, dir: act });
    else if (act === 'show') api('show', { id });
    else if (act === 'remove') api('remove', { id });
    else if (act === 'requeue') { api('requeue', { id }); toast('Moved to the front of the queue'); }
    else if (act === 'edit') {
      const item = state.queue.find((q) => q.id === id);
      const name = prompt('Edit name:', item ? item.name : '');
      if (name && name.trim()) api('update', { id, name: name.trim() });
    }
  });

  // ---- Main action bar -----------------------------------------------------------------
  $('btn-next').addEventListener('click', () => api('next'));
  $('btn-prev').addEventListener('click', () => api('prev'));
  $('btn-clear').addEventListener('click', () => api('clearScreen'));

  // Keyboard shortcuts when driven from a laptop
  document.addEventListener('keydown', (e) => {
    const tag = document.activeElement && document.activeElement.tagName;
    if (tag === 'INPUT' || tag === 'TEXTAREA') return;
    if (e.key === ' ' || e.key === 'ArrowRight') { e.preventDefault(); if (!$('btn-next').disabled) api('next'); }
    if (e.key === 'ArrowLeft') { e.preventDefault(); if (!$('btn-prev').disabled) api('prev'); }
  });

  // ---- Settings -----------------------------------------------------------------------
  for (const id of ['set-title', 'set-idle']) {
    $(id).addEventListener('focus', () => { editingSettings = true; });
    $(id).addEventListener('blur', () => { editingSettings = false; });
  }
  $('set-save').addEventListener('click', async () => {
    editingSettings = false;
    if (await api('settings', {
      title: $('set-title').value,
      idleMessage: $('set-idle').value,
      showUpNext: $('set-upnext').checked,
    })) toast('Settings saved');
  });
  $('set-upnext').addEventListener('change', () => {
    api('settings', { showUpNext: $('set-upnext').checked });
  });

  // ---- Reset ----------------------------------------------------------------------
  $('btn-clear-queue').addEventListener('click', () => {
    if (confirm('Remove ALL names from the queue?')) api('reset', { scope: 'queue' });
  });
  $('btn-clear-hist').addEventListener('click', () => {
    if (confirm('Clear the announced history?')) api('reset', { scope: 'announced' });
  });
  $('btn-reset').addEventListener('click', () => {
    if (confirm('Reset EVERYTHING? This clears the queue, history, and the screen.')) {
      api('reset', { scope: 'all' });
    }
  });
})();
</script>
</body>
</html>
