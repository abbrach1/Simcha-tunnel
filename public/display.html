<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Camp Simcha">
<meta name="format-detection" content="telephone=no">
<title>Camp Simcha — Display</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    overflow: hidden;
    overscroll-behavior: none;
    background: #000;
    color: #fff;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    touch-action: manipulation;
  }

  body { display: flex; flex-direction: column; }

  #stage {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: max(4vmin, env(safe-area-inset-top)) 4vmin 4vmin;
    text-align: center;
    cursor: pointer;
  }

  #kicker {
    font-size: clamp(15px, 3.4vmin, 36px);
    font-weight: 500;
    color: #999;
    margin-bottom: 2.5vmin;
  }
  /* Counselor call: a big orange banner so it can't be mistaken for an arrival */
  #kicker.call {
    align-self: stretch;
    background: #d97a00;
    color: #fff;
    font-size: clamp(24px, 6.5vmin, 76px);
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: .04em;
    padding: 1.2vmin 4vmin;
    border-radius: 1.2vmin;
  }
  #idle-sub.call {
    color: #e8a33d;
    font-weight: 600;
  }

  /* Attention flash: red blinking band + pulsing screen background */
  #flashbar {
    flex-shrink: 0;
    text-align: center;
    font-weight: 800;
    font-size: clamp(22px, 6vmin, 70px);
    line-height: 1.15;
    padding: 1.6vmin 4vmin;
    padding-top: max(1.6vmin, env(safe-area-inset-top));
    background: #d92b2b;
    color: #fff;
    text-transform: uppercase;
    letter-spacing: .03em;
    animation: flashband 1s steps(2, jump-none) infinite;
    overflow-wrap: break-word;
  }
  #flashbar.hidden { display: none; }
  @keyframes flashband {
    0%, 100% { background: #d92b2b; }
    50% { background: #6e0f0f; }
  }
  body.flash { animation: flashbg 1s steps(2, jump-none) infinite; }
  @keyframes flashbg {
    0%, 100% { background-color: #000; }
    50% { background-color: #3d0d0d; }
  }
  body.light.flash { animation: flashbg-light 1s steps(2, jump-none) infinite; }
  @keyframes flashbg-light {
    0%, 100% { background-color: #fff; }
    50% { background-color: #ffd6d6; }
  }
  @media (prefers-reduced-motion: reduce) {
    #flashbar, body.flash, body.light.flash { animation: none; }
  }
  body.flash #hint { display: none; }

  /* Counselor-call section shown ALONGSIDE the arrival (its own band) */
  #callbar {
    flex-shrink: 0;
    background: #d97a00;
    color: #fff;
    text-align: center;
    padding: 1.2vmin 4vmin;
  }
  #callbar .cb-label {
    font-size: clamp(14px, 3vmin, 32px);
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: .04em;
    opacity: .9;
  }
  #callbar .cb-name {
    font-size: clamp(28px, 8vmin, 90px);
    font-weight: 800;
    line-height: 1.1;
    overflow-wrap: break-word;
  }
  #callbar.hidden { display: none; }

  #name {
    font-weight: 800;
    line-height: 1.05;
    max-width: 96vw;
    overflow-wrap: break-word;
  }

  #idle-sub {
    margin-top: 3vmin;
    font-size: clamp(16px, 4vmin, 42px);
    color: #999;
    font-weight: 400;
  }

  #upnext {
    flex-shrink: 0;
    max-height: 52vh;
    overflow: hidden;
    padding: 1.5vmin 5vmin max(1.5vmin, env(safe-area-inset-bottom));
    background: #111;
    border-top: 1px solid #2a2a2a;
  }
  #upnext .panels { display: flex; gap: 6vmin; }
  #upnext .panel { flex: 1; min-width: 0; }
  @media (orientation: portrait) {
    #upnext .panels { flex-direction: column; gap: 1.5vmin; }
  }
  #upnext .un-title {
    color: #888;
    font-size: clamp(15px, 3.2vmin, 32px);
    margin-bottom: .4vmin;
  }
  #upnext .panel.calls .un-title { color: #e8a33d; }
  #upnext ol { list-style: none; }
  #upnext li {
    font-size: clamp(24px, 6vmin, 64px);
    color: #ddd;
    padding: .5vmin 0;
    border-top: 1px solid #1e1e1e;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  #upnext li:first-child { border-top: none; color: #fff; font-weight: 700; }
  #upnext li .num { color: #777; font-weight: 400; margin-right: .5em; }
  #upnext .more {
    color: #888;
    font-size: clamp(15px, 3.4vmin, 34px);
    padding-top: .5vmin;
  }
  #upnext.hidden { display: none; }

  /* ---- Light mode (for outdoor daylight) ---- */
  body.light { background: #fff; color: #000; }
  body.light #kicker { color: #555; }
  body.light #idle-sub { color: #555; }
  body.light #upnext { background: #f0f0f0; border-top-color: #ccc; }
  body.light #upnext .un-title { color: #666; }
  body.light #kicker.call { background: #d97a00; color: #fff; }
  body.light #idle-sub.call { color: #b25a00; }
  body.light #upnext .panel.calls .un-title { color: #b25a00; }
  body.light #upnext li { color: #333; border-top-color: #ddd; }
  body.light #upnext li:first-child { color: #000; }
  body.light #upnext li .num { color: #888; }
  body.light #upnext .more { color: #666; }
  body.light #status { background: rgba(0,0,0,.08); color: #444; }
  body.light #hint { color: rgba(0,0,0,.45); }

  #status {
    position: fixed;
    top: max(10px, env(safe-area-inset-top));
    right: 12px;
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    color: rgba(255,255,255,.6);
    padding: 6px 12px;
    border-radius: 999px;
    background: rgba(0,0,0,.35);
    transition: opacity .5s;
  }
  #status .dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    background: #2ecc71;
  }
  #status.offline .dot { background: #e74c3c; animation: blink 1s infinite; }
  @keyframes blink { 50% { opacity: .25; } }
  #status.faded { opacity: 0; pointer-events: none; }

  #hint {
    position: fixed;
    left: 0; right: 0;
    top: max(12px, env(safe-area-inset-top));
    text-align: center;
    font-size: 13px;
    color: rgba(255,255,255,.45);
    transition: opacity 1s;
  }
  #hint.faded { opacity: 0; }
</style>
</head>
<body>
  <div id="hint">Tap anywhere for fullscreen</div>
  <div id="status" class="offline"><span class="dot"></span><span id="status-text">Connecting…</span></div>

  <div id="flashbar" class="hidden"></div>

  <div id="stage">
    <div id="kicker">Standby</div>
    <div id="name">…</div>
    <div id="idle-sub"></div>
  </div>

  <div id="callbar" class="hidden">
    <div class="cb-label">Calling counselor — your camper is here</div>
    <div class="cb-name"></div>
  </div>

  <div id="upnext" class="hidden"></div>

<script src="logic.js"></script>
<script src="firebase-config.js"></script>
<script>
(() => {
  'use strict';

  const $ = (id) => document.getElementById(id);
  const stage = $('stage');
  const kickerEl = $('kicker');
  const nameEl = $('name');
  const idleSubEl = $('idle-sub');
  const upnextEl = $('upnext');
  const statusEl = $('status');
  const statusText = $('status-text');
  const hintEl = $('hint');

  let state = null;

  const esc = (s) => s.replace(/[&<>"']/g, (c) => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
  }[c]));

  // ---- Text auto-fit: biggest font size that fits the stage ----------------
  function fitText() {
    const maxW = stage.clientWidth * 0.94;
    // A call alone on stage shows the banner + subtitle, which need room.
    const callOnStage = state && state.currentCall && !state.currentArrival;
    const maxH = stage.clientHeight * (callOnStage ? 0.48 : 0.62);
    let lo = 16, hi = 400;
    while (lo < hi) {
      const mid = Math.ceil((lo + hi) / 2);
      nameEl.style.fontSize = mid + 'px';
      if (nameEl.scrollWidth <= maxW && nameEl.scrollHeight <= maxH) lo = mid;
      else hi = mid - 1;
    }
    nameEl.style.fontSize = lo + 'px';
  }

  // ---- Render ----------------------------------------------------------------
  function render() {
    if (!state) return;
    document.title = state.title + ' — Display';

    const light = state.theme === 'light';
    document.body.classList.toggle('light', light);
    const themeMeta = document.querySelector('meta[name=theme-color]');
    if (themeMeta) themeMeta.content = light ? '#ffffff' : '#000000';

    // Attention flash: red band with the flash message, whole screen pulses.
    const flashbar = document.getElementById('flashbar');
    document.body.classList.toggle('flash', !!state.flashOn);
    if (state.flashOn) {
      flashbar.textContent = state.flashText || 'Waiting by the tunnel';
      flashbar.classList.remove('hidden');
    } else {
      flashbar.classList.add('hidden');
    }

    // Two independent slots: an arrival and a counselor call can be on
    // screen at the same time, each in its own section.
    const arrival = state.currentArrival;
    const call = state.currentCall;
    const callbar = document.getElementById('callbar');

    // The call gets the main stage only when there's no arrival showing;
    // otherwise it appears in its own orange band below the arrival.
    const callOnStage = call && !arrival;
    kickerEl.classList.toggle('call', !!callOnStage);
    idleSubEl.classList.toggle('call', !!callOnStage);
    if (arrival) {
      kickerEl.textContent = 'Now arriving';
      idleSubEl.textContent = '';
      nameEl.textContent = arrival.name;
    } else if (call) {
      kickerEl.textContent = 'Calling counselor';
      idleSubEl.textContent = 'Your camper has arrived — come to the stage';
      nameEl.textContent = call.name;
    } else {
      kickerEl.textContent = 'Standby';
      nameEl.textContent = state.title;
      idleSubEl.textContent = state.idleMessage || '';
    }

    if (call && arrival) {
      callbar.querySelector('.cb-name').textContent = call.name;
      callbar.classList.remove('hidden');
    } else {
      callbar.classList.add('hidden');
    }

    // Up-next panels: arrivals and counselor calls each get one when non-empty.
    const panels = [];
    if (state.showUpNext) {
      if (state.queue.length) panels.push({ title: 'Up next', cls: '', items: state.queue });
      if ((state.callQueue || []).length) panels.push({ title: 'Counselor calls', cls: 'calls', items: state.callQueue });
    }
    if (panels.length) {
      // Portrait fits more rows than landscape; split the room when both show.
      const portrait = innerHeight > innerWidth;
      const max = portrait ? (panels.length > 1 ? 4 : 7) : 3;
      upnextEl.innerHTML = '<div class="panels">' + panels.map((p) => {
        const shown = p.items.slice(0, max);
        const more = p.items.length - shown.length;
        return `<div class="panel ${p.cls}"><div class="un-title">${p.title}</div><ol>`
          + shown.map((q, i) => `<li><span class="num">${i + 1}.</span>${esc(q.name)}</li>`).join('')
          + '</ol>'
          + (more > 0 ? `<div class="more">+ ${more} more</div>` : '')
          + '</div>';
      }).join('') + '</div>';
      upnextEl.classList.remove('hidden');
    } else {
      upnextEl.classList.add('hidden');
    }

    fitText();
  }

  // ---- Live connection ---------------------------------------------------------
  // Built to stay connected: fast retries (0.5s → 3s cap), a heartbeat
  // watchdog that catches silently-dead connections, and instant reconnect
  // when the network comes back or the page wakes up.
  let es = null;
  let retryDelay = 500;
  let retryTimer = null;
  let lastSeen = 0;
  let fadeTimer = null;

  // On serverless hosts (e.g. Vercel) there is no SSE endpoint; after a few
  // quick SSE failures we fall back to polling GET /api/state instead.
  const clientId = Math.random().toString(36).slice(2, 10);
  let polling = false;
  let pollTimer = null;
  let sseFailures = 0;

  async function pollNow() {
    clearTimeout(pollTimer);
    try {
      const r = await fetch('/api/state?role=display&id=' + clientId, { cache: 'no-store' });
      if (!r.ok) throw new Error('poll failed');
      handleState(await r.json());
      lastSeen = Date.now();
      setStatus(true);
    } catch {
      setStatus(false);
    }
    if (polling) pollTimer = setTimeout(pollNow, 1500);
  }

  function startPolling() {
    if (polling) return;
    polling = true;
    clearTimeout(retryTimer);
    if (es) {
      es.onerror = null;
      es.onmessage = null;
      try { es.close(); } catch { /* ignore */ }
    }
    pollNow();
  }

  // ---- Firebase mode ------------------------------------------------------------
  // When the host has no SSE (static hosting / Vercel) and a Firebase project
  // is configured, sync through Firestore instead: real push updates, no
  // server at all. Actions run as Firestore transactions using the same
  // shared logic (window.SimchaLogic).
  let fbActive = false;
  let fbApply = null;
  let fbProbe = null;
  let fbCleanup = null;
  let lastRestOk = 0;     // last successful plain-HTTPS REST read
  let fbHealthyAt = 0;    // last REAL server contact (never reset by rebuilds)
  const pageLoadAt = Date.now();

  function serverContact() {
    lastSeen = Date.now();
    fbHealthyAt = lastSeen;
  }

  // Hammer of last resort: if neither the live channel nor plain REST reads
  // have reached the server for 2 minutes, do exactly what a human would —
  // reload the page (rate-limited; the display repaints from cache, so the
  // reload is seamless).
  function hardReload() {
    const last = Number(sessionStorage.getItem('simcha-hard-reload-at') || 0);
    if (Date.now() - last < 180000) return;
    sessionStorage.setItem('simcha-hard-reload-at', String(Date.now()));
    location.reload();
  }

  // Decode Firestore's REST document format into plain JS.
  function fromFs(v) {
    if (v.stringValue !== undefined) return v.stringValue;
    if (v.integerValue !== undefined) return Number(v.integerValue);
    if (v.doubleValue !== undefined) return v.doubleValue;
    if (v.booleanValue !== undefined) return v.booleanValue;
    if (v.nullValue !== undefined) return null;
    if (v.timestampValue !== undefined) return new Date(v.timestampValue).getTime();
    if (v.arrayValue) return (v.arrayValue.values || []).map(fromFs);
    if (v.mapValue) return decodeFsFields(v.mapValue.fields);
    return null;
  }
  function decodeFsFields(fields) {
    const o = {};
    for (const k in (fields || {})) o[k] = fromFs(fields[k]);
    return o;
  }

  function applyRemote(action, params) {
    if (fbApply) return fbApply(action, params).catch(() => {});
    return fetch('/api/' + action, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(params),
    }).catch(() => {});
  }

  // Tear down a wedged Firebase pipeline and build a fresh one. The SDK
  // usually reconnects itself, but on phones the stream can die silently
  // after backgrounding — this is the recovery path the watchdog uses.
  function restartFirebase() {
    if (!fbActive) return;
    setStatus(false);
    if (fbCleanup) { try { fbCleanup(); } catch { /* ignore */ } fbCleanup = null; }
    fbActive = false;
    fbApply = null;
    fbProbe = null;
    startFirebase();
  }

  async function startFirebase() {
    if (fbActive) return;
    fbActive = true;
    polling = false;            // leaving polling mode if we were in it
    clearTimeout(pollTimer);
    lastSeen = Date.now();
    clearTimeout(retryTimer);
    if (es) {
      es.onerror = null;
      es.onmessage = null;
      try { es.close(); } catch { /* ignore */ }
    }
    try {
      const SDK = window.FIREBASE_SDK_BASE || 'https://www.gstatic.com/firebasejs/10.12.2';
      const [appMod, fsMod] = await Promise.all([
        import(SDK + '/firebase-app.js'),
        import(SDK + '/firebase-firestore.js'),
      ]);
      // Unique app name so a rebuilt pipeline never collides with the old one.
      const app = appMod.initializeApp(window.FIREBASE_CONFIG, 'app-' + Date.now());
      // Force long-polling transport: filtered/proxied Wi-Fi (common at camp)
      // silently kills Firestore's streaming channel — the page then loads
      // fine but never receives pushes. Long-polling works everywhere.
      let db;
      try {
        db = fsMod.initializeFirestore(app, { experimentalForceLongPolling: true, useFetchStreams: false });
      } catch {
        db = fsMod.getFirestore(app);
      }
      const boardRef = fsMod.doc(db, 'boards', 'main');
      let counts = { displays: 0, dashboards: 0 };
      let latest = null;
      const emit = () => { if (latest) handleState({ ...latest, clients: counts }); };

      fbApply = (action, params) => fsMod.runTransaction(db, async (tx) => {
        const snap = await tx.get(boardRef);
        const st = snap.exists()
          ? { ...SimchaLogic.defaultState(), ...snap.data() }
          : SimchaLogic.defaultState();
        if (!SimchaLogic.applyAction(st, action, params || {})) throw new Error('Unknown action');
        tx.set(boardRef, st);
      }).then((r) => { lastSeen = Date.now(); return r; });

      const unsubBoard = fsMod.onSnapshot(boardRef, { includeMetadataChanges: true }, (snap) => {
        latest = snap.data() || SimchaLogic.defaultState();
        if (!snap.metadata.fromCache) serverContact();
        setStatus(!snap.metadata.fromCache);
        emit();
      }, () => setStatus(false));

      // REST backstop: a plain HTTPS read of the board every 4s. Even if the
      // SDK's live channel silently dies (some networks kill it), this is the
      // same kind of request as a manual page refresh — so the screen keeps
      // updating no matter what.
      const restBase = window.FIRESTORE_REST_BASE
        || ('https://firestore.googleapis.com/v1/projects/'
            + window.FIREBASE_CONFIG.projectId + '/databases/(default)/documents');
      const restTick = async () => {
        try {
          const r = await fetch(restBase + '/boards/main', { cache: 'no-store' });
          if (r.status === 404) { lastRestOk = Date.now(); return; }
          if (!r.ok) return;
          const docJson = await r.json();
          lastRestOk = Date.now();
          const data = decodeFsFields(docJson.fields);
          if (!latest || (data.lastActivityAt || 0) > (latest.lastActivityAt || 0)) {
            latest = { ...SimchaLogic.defaultState(), ...data };
            emit();
          }
        } catch { /* offline — the watchdog handles prolonged silence */ }
      };
      const restTimer = setInterval(restTick, 4000);

      // Active liveness probe: fetch the doc FROM THE SERVER, bypassing the
      // cache. Used the moment the page wakes up (so the display catches up
      // immediately without a manual refresh) and by the watchdog.
      fbProbe = async () => {
        try {
          const snap = await Promise.race([
            fsMod.getDocFromServer(boardRef),
            new Promise((_, rej) => setTimeout(() => rej(new Error('probe timeout')), 8000)),
          ]);
          latest = snap.data() || SimchaLogic.defaultState();
          serverContact();
          setStatus(true);
          emit();
        } catch {
          restartFirebase();
        }
        restTick(); // the REST path double-checks either way
      };

      // Presence heartbeat so dashboards can count connected displays.
      // ts is a Firestore SERVER timestamp: phone clock skew can't make a
      // live device look stale. Freshness is judged by comparing server
      // timestamps to each other (newest beat = "now"), never to a phone
      // clock. Beats also fire immediately when the page wakes up.
      const meRef = fsMod.doc(db, 'boards', 'main', 'clients', clientId);
      const beat = () => fsMod.setDoc(meRef, { role: 'display', ts: fsMod.serverTimestamp() }).catch(() => {});
      beat();
      const beatTimer = setInterval(beat, 7000);
      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible') beat();
      });
      addEventListener('online', beat);
      addEventListener('pageshow', beat);
      const unsubClients = fsMod.onSnapshot(fsMod.collection(db, 'boards', 'main', 'clients'), (qs) => {
        // Server-acked snapshots (incl. our own 7s beats) prove liveness.
        if (!qs.metadata || !qs.metadata.fromCache) serverContact();
        const entries = [];
        qs.forEach((d) => {
          const c = d.data();
          if (!c) return;
          const ms = c.ts && typeof c.ts.toMillis === 'function' ? c.ts.toMillis()
            : (typeof c.ts === 'number' ? c.ts : null);
          entries.push({ role: c.role, ms });
        });
        const maxMs = entries.reduce((m, e) => (e.ms && e.ms > m ? e.ms : m), 0);
        const next = { displays: 0, dashboards: 0 };
        for (const e of entries) {
          // ms === null is my own just-written beat (serverTimestamp pending).
          const fresh = e.ms === null || maxMs - e.ms < 25000;
          if (!fresh) continue;
          if (e.role === 'display') next.displays++;
          else if (e.role === 'dashboard') next.dashboards++;
        }
        counts = next;
        emit();
      }, () => { /* counts stay stale — not critical */ });

      fbCleanup = () => {
        try { unsubBoard(); } catch { /* ignore */ }
        try { unsubClients(); } catch { /* ignore */ }
        clearInterval(beatTimer);
        clearInterval(restTimer);
        if (appMod.deleteApp) appMod.deleteApp(app).catch(() => {});
      };
    } catch {
      // SDK failed to load (e.g. flaky network at page load) — poll /api for
      // now, but KEEP retrying Firebase so we never settle on a dead /api.
      fbActive = false;
      fbApply = null;
      fbProbe = null;
      startPolling();
      setTimeout(() => {
        if (window.FIREBASE_CONFIG && !fbActive) startFirebase();
      }, 8000);
    }
  }

  function setStatus(online) {
    statusEl.classList.toggle('offline', !online);
    // Show the transport so a stale screen can be diagnosed at a glance.
    const mode = fbActive ? ' · Firebase' : (polling ? ' · polling' : '');
    statusText.textContent = online ? 'Live' + mode : 'Reconnecting…' + mode;
    clearTimeout(fadeTimer);
    statusEl.classList.remove('faded');
    if (online) {
      fadeTimer = setTimeout(() => statusEl.classList.add('faded'), 4000);
    }
  }

  // ---- Local cache & auto-restore ----------------------------------------------
  // The display mirrors the last non-empty state to localStorage. If the
  // server ever comes back EMPTY and UNTOUCHED (lost its data — not a staff
  // reset, which stamps lastActivityAt), the display pushes its cache back,
  // including re-showing the exact name that was on screen. The server only
  // accepts a restore while empty, so multiple phones can't fight.
  const CACHE_KEY = 'camp-simcha-display-cache';
  let autoRestoreTried = false;

  const isEmptyState = (s) => !s.currentArrival && !s.currentCall
    && !s.queue.length && !s.announced.length
    && !(s.callQueue || []).length && !(s.callAnnounced || []).length;

  function handleState(s) {
    if (!isEmptyState(s)) {
      autoRestoreTried = false;
      try {
        localStorage.setItem(CACHE_KEY, JSON.stringify({ at: Date.now(), state: s }));
      } catch { /* best-effort */ }
    } else if (!s.lastActivityAt && !autoRestoreTried) {
      let cached = null;
      try { cached = JSON.parse(localStorage.getItem(CACHE_KEY)); } catch { /* ignore */ }
      if (cached && cached.state && Date.now() - cached.at < 24 * 3600 * 1000) {
        autoRestoreTried = true;
        const c = cached.state;
        applyRemote('restore', {
          at: cached.at,
          queue: c.queue,
          announced: c.announced,
          callQueue: c.callQueue,
          callAnnounced: c.callAnnounced,
          title: c.title,
          idleMessage: c.idleMessage,
          showUpNext: c.showUpNext,
          theme: c.theme,
          flashText: c.flashText,
          showCurrent: { arrival: !!c.currentArrival, call: !!c.currentCall },
        });
        // Keep showing the cached content; the restored state arrives next.
        state = c;
        render();
        return;
      }
    }
    state = s;
    render();
  }

  // Show the last known content immediately on load, before connecting.
  try {
    const cached = JSON.parse(localStorage.getItem(CACHE_KEY));
    if (cached && cached.state) {
      state = cached.state;
      render();
    }
  } catch { /* ignore */ }

  function connect() {
    clearTimeout(retryTimer);
    if (es) {
      es.onerror = null;
      es.onmessage = null;
      try { es.close(); } catch { /* already closed */ }
    }
    es = new EventSource('/events?role=display');
    es.onopen = () => { retryDelay = 500; sseFailures = 0; lastSeen = Date.now(); setStatus(true); };
    es.onmessage = (e) => {
      lastSeen = Date.now();
      handleState(JSON.parse(e.data));
    };
    es.addEventListener('ping', () => { lastSeen = Date.now(); });
    es.onerror = () => {
      setStatus(false);
      try { es.close(); } catch { /* ignore */ }
      if (++sseFailures >= 3) {
        if (window.FIREBASE_CONFIG) startFirebase();
        else startPolling();
        return;
      }
      clearTimeout(retryTimer);
      retryTimer = setTimeout(connect, retryDelay);
      retryDelay = Math.min(retryDelay * 2, 3000);
    };
  }
  connect();

  function reconnectNow() {
    if (fbActive) {
      // Fetch fresh data from the server right now; rebuild if it fails.
      if (fbProbe) fbProbe();
      return;
    }
    if (polling) {
      pollNow();
      return;
    }
    retryDelay = 500;
    connect();
  }

  // Liveness watchdog. SSE mode: the server pings every 10s. Firebase mode:
  // our own presence beats produce server-acked snapshots every ~7s. Either
  // way, silence for 30s means the connection died without an error —
  // rebuild it. (Polling mode has its own success/failure signal per poll.)
  setInterval(() => {
    if (polling || !lastSeen) return;
    const now = Date.now();
    if (fbActive) {
      if (now - lastSeen > 30000) restartFirebase();
      // Nothing (live channel OR plain REST) for 2 minutes → real reload.
      if (now - Math.max(fbHealthyAt, lastRestOk, pageLoadAt) > 120000) hardReload();
      return;
    }
    if (now - lastSeen > 30000) {
      setStatus(false);
      reconnectNow();
    }
  }, 5000);

  // Reconnect immediately when the network returns or the page wakes up
  // (iOS Safari kills SSE connections in the background).
  addEventListener('online', reconnectNow);
  addEventListener('pageshow', (e) => { if (e.persisted) reconnectNow(); });
  addEventListener('focus', reconnectNow);
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') reconnectNow();
  });

  // ---- Self-update -----------------------------------------------------------
  // A screen left open for days (e.g. an iPad on the stage) keeps running
  // whatever version it loaded, missing every fix that ships later. Compare
  // the currently-served page against the copy we booted with, and reload
  // once (rate-limited) when the deployment changes. The reload is
  // near-seamless: the display renders its cached state instantly on load.
  let pageBaseline = null;
  async function checkForUpdate() {
    try {
      const r = await fetch(location.pathname + location.search, { cache: 'no-store' });
      if (!r.ok) return;
      const text = await r.text();
      if (pageBaseline === null) {
        pageBaseline = text;
        return;
      }
      if (text !== pageBaseline) {
        const last = Number(sessionStorage.getItem('simcha-reload-at') || 0);
        if (Date.now() - last > 10 * 60 * 1000) {
          sessionStorage.setItem('simcha-reload-at', String(Date.now()));
          location.reload();
        }
      }
    } catch { /* offline — try again later */ }
  }
  checkForUpdate();
  setInterval(checkForUpdate, 5 * 60 * 1000);
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') checkForUpdate();
  });

  // ---- Keep the phone awake -----------------------------------------------------
  let wakeLock = null;
  async function requestWakeLock() {
    try {
      if ('wakeLock' in navigator) {
        wakeLock = await navigator.wakeLock.request('screen');
      }
    } catch { /* not critical */ }
  }
  requestWakeLock();
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') requestWakeLock();
  });

  // ---- Fullscreen -------------------------------------------------------------------
  // iPhone Safari has no Fullscreen API; the app-like experience there comes
  // from Add to Home Screen (standalone mode) instead.
  const isStandalone = navigator.standalone === true
    || matchMedia('(display-mode: standalone)').matches
    || matchMedia('(display-mode: fullscreen)').matches;
  const canFullscreen = !!document.documentElement.requestFullscreen;

  if (isStandalone) {
    hintEl.classList.add('faded');
  } else if (!canFullscreen) {
    hintEl.textContent = 'Tip: Share → “Add to Home Screen” for a fullscreen app';
  }

  stage.addEventListener('click', () => {
    hintEl.classList.add('faded');
    if (canFullscreen && !document.fullscreenElement) {
      document.documentElement.requestFullscreen().catch(() => {});
    }
    requestWakeLock();
  });
  setTimeout(() => hintEl.classList.add('faded'), 12000);

  addEventListener('resize', () => (state ? render() : fitText()));
})();
</script>
</body>
</html>
