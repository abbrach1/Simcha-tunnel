<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Camp Simcha">
<meta name="format-detection" content="telephone=no">
<title>Camp Simcha — Display</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    overflow: hidden;
    overscroll-behavior: none;
    background: #000;
    color: #fff;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    touch-action: manipulation;
  }

  body { display: flex; flex-direction: column; }

  #stage {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: max(4vmin, env(safe-area-inset-top)) 4vmin 4vmin;
    text-align: center;
    cursor: pointer;
  }

  #kicker {
    font-size: clamp(15px, 3.4vmin, 36px);
    font-weight: 500;
    color: #999;
    margin-bottom: 2.5vmin;
  }
  #kicker.call {
    color: #e8a33d;
    font-weight: 700;
  }

  #name {
    font-weight: 800;
    line-height: 1.05;
    max-width: 96vw;
    overflow-wrap: break-word;
  }

  #idle-sub {
    margin-top: 3vmin;
    font-size: clamp(16px, 4vmin, 42px);
    color: #999;
    font-weight: 400;
  }

  #upnext {
    flex-shrink: 0;
    max-height: 52vh;
    overflow: hidden;
    padding: 1.5vmin 5vmin max(1.5vmin, env(safe-area-inset-bottom));
    background: #111;
    border-top: 1px solid #2a2a2a;
  }
  #upnext .panels { display: flex; gap: 6vmin; }
  #upnext .panel { flex: 1; min-width: 0; }
  @media (orientation: portrait) {
    #upnext .panels { flex-direction: column; gap: 1.5vmin; }
  }
  #upnext .un-title {
    color: #888;
    font-size: clamp(15px, 3.2vmin, 32px);
    margin-bottom: .4vmin;
  }
  #upnext .panel.calls .un-title { color: #e8a33d; }
  #upnext ol { list-style: none; }
  #upnext li {
    font-size: clamp(24px, 6vmin, 64px);
    color: #ddd;
    padding: .5vmin 0;
    border-top: 1px solid #1e1e1e;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  #upnext li:first-child { border-top: none; color: #fff; font-weight: 700; }
  #upnext li .num { color: #777; font-weight: 400; margin-right: .5em; }
  #upnext .more {
    color: #888;
    font-size: clamp(15px, 3.4vmin, 34px);
    padding-top: .5vmin;
  }
  #upnext.hidden { display: none; }

  /* ---- Light mode (for outdoor daylight) ---- */
  body.light { background: #fff; color: #000; }
  body.light #kicker { color: #555; }
  body.light #idle-sub { color: #555; }
  body.light #upnext { background: #f0f0f0; border-top-color: #ccc; }
  body.light #upnext .un-title { color: #666; }
  body.light #kicker.call { color: #b25a00; }
  body.light #upnext .panel.calls .un-title { color: #b25a00; }
  body.light #upnext li { color: #333; border-top-color: #ddd; }
  body.light #upnext li:first-child { color: #000; }
  body.light #upnext li .num { color: #888; }
  body.light #upnext .more { color: #666; }
  body.light #status { background: rgba(0,0,0,.08); color: #444; }
  body.light #hint { color: rgba(0,0,0,.45); }

  #status {
    position: fixed;
    top: max(10px, env(safe-area-inset-top));
    right: 12px;
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    color: rgba(255,255,255,.6);
    padding: 6px 12px;
    border-radius: 999px;
    background: rgba(0,0,0,.35);
    transition: opacity .5s;
  }
  #status .dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    background: #2ecc71;
  }
  #status.offline .dot { background: #e74c3c; animation: blink 1s infinite; }
  @keyframes blink { 50% { opacity: .25; } }
  #status.faded { opacity: 0; pointer-events: none; }

  #hint {
    position: fixed;
    left: 0; right: 0;
    top: max(12px, env(safe-area-inset-top));
    text-align: center;
    font-size: 13px;
    color: rgba(255,255,255,.45);
    transition: opacity 1s;
  }
  #hint.faded { opacity: 0; }
</style>
</head>
<body>
  <div id="hint">Tap anywhere for fullscreen</div>
  <div id="status" class="offline"><span class="dot"></span><span id="status-text">Connecting…</span></div>

  <div id="stage">
    <div id="kicker">Standby</div>
    <div id="name">…</div>
    <div id="idle-sub"></div>
  </div>

  <div id="upnext" class="hidden"></div>

<script>
(() => {
  'use strict';

  const $ = (id) => document.getElementById(id);
  const stage = $('stage');
  const kickerEl = $('kicker');
  const nameEl = $('name');
  const idleSubEl = $('idle-sub');
  const upnextEl = $('upnext');
  const statusEl = $('status');
  const statusText = $('status-text');
  const hintEl = $('hint');

  let state = null;

  const esc = (s) => s.replace(/[&<>"']/g, (c) => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
  }[c]));

  // ---- Text auto-fit: biggest font size that fits the stage ----------------
  function fitText() {
    const maxW = stage.clientWidth * 0.94;
    const maxH = stage.clientHeight * 0.62;
    let lo = 16, hi = 400;
    while (lo < hi) {
      const mid = Math.ceil((lo + hi) / 2);
      nameEl.style.fontSize = mid + 'px';
      if (nameEl.scrollWidth <= maxW && nameEl.scrollHeight <= maxH) lo = mid;
      else hi = mid - 1;
    }
    nameEl.style.fontSize = lo + 'px';
  }

  // ---- Render ----------------------------------------------------------------
  function render() {
    if (!state) return;
    document.title = state.title + ' — Display';

    const light = state.theme === 'light';
    document.body.classList.toggle('light', light);
    const themeMeta = document.querySelector('meta[name=theme-color]');
    if (themeMeta) themeMeta.content = light ? '#ffffff' : '#000000';

    const isCall = state.current && state.current.type === 'call';
    kickerEl.classList.toggle('call', !!isCall);
    if (state.current) {
      kickerEl.textContent = isCall ? 'Counselor call — your camper is here' : 'Now arriving';
      idleSubEl.textContent = '';
      nameEl.textContent = state.current.name;
    } else {
      kickerEl.textContent = 'Standby';
      nameEl.textContent = state.title;
      idleSubEl.textContent = state.idleMessage || '';
    }

    // Up-next panels: arrivals and counselor calls each get one when non-empty.
    const panels = [];
    if (state.showUpNext) {
      if (state.queue.length) panels.push({ title: 'Up next', cls: '', items: state.queue });
      if ((state.callQueue || []).length) panels.push({ title: 'Counselor calls', cls: 'calls', items: state.callQueue });
    }
    if (panels.length) {
      // Portrait fits more rows than landscape; split the room when both show.
      const portrait = innerHeight > innerWidth;
      const max = portrait ? (panels.length > 1 ? 4 : 7) : 3;
      upnextEl.innerHTML = '<div class="panels">' + panels.map((p) => {
        const shown = p.items.slice(0, max);
        const more = p.items.length - shown.length;
        return `<div class="panel ${p.cls}"><div class="un-title">${p.title}</div><ol>`
          + shown.map((q, i) => `<li><span class="num">${i + 1}.</span>${esc(q.name)}</li>`).join('')
          + '</ol>'
          + (more > 0 ? `<div class="more">+ ${more} more</div>` : '')
          + '</div>';
      }).join('') + '</div>';
      upnextEl.classList.remove('hidden');
    } else {
      upnextEl.classList.add('hidden');
    }

    fitText();
  }

  // ---- Live connection ---------------------------------------------------------
  let es = null;
  let retryDelay = 1000;
  let fadeTimer = null;

  function setStatus(online) {
    statusEl.classList.toggle('offline', !online);
    statusText.textContent = online ? 'Live' : 'Reconnecting…';
    clearTimeout(fadeTimer);
    statusEl.classList.remove('faded');
    if (online) {
      fadeTimer = setTimeout(() => statusEl.classList.add('faded'), 4000);
    }
  }

  function connect() {
    es = new EventSource('/events?role=display');
    es.onopen = () => { retryDelay = 1000; setStatus(true); };
    es.onmessage = (e) => {
      state = JSON.parse(e.data);
      render();
    };
    es.onerror = () => {
      setStatus(false);
      es.close();
      setTimeout(connect, retryDelay);
      retryDelay = Math.min(retryDelay * 2, 15000);
    };
  }
  connect();

  // iOS Safari silently kills SSE connections in the background —
  // reconnect fresh whenever the page becomes visible again.
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && es) {
      es.onerror = null;
      es.close();
      retryDelay = 1000;
      connect();
    }
  });

  // ---- Keep the phone awake -----------------------------------------------------
  let wakeLock = null;
  async function requestWakeLock() {
    try {
      if ('wakeLock' in navigator) {
        wakeLock = await navigator.wakeLock.request('screen');
      }
    } catch { /* not critical */ }
  }
  requestWakeLock();
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') requestWakeLock();
  });

  // ---- Fullscreen -------------------------------------------------------------------
  // iPhone Safari has no Fullscreen API; the app-like experience there comes
  // from Add to Home Screen (standalone mode) instead.
  const isStandalone = navigator.standalone === true
    || matchMedia('(display-mode: standalone)').matches
    || matchMedia('(display-mode: fullscreen)').matches;
  const canFullscreen = !!document.documentElement.requestFullscreen;

  if (isStandalone) {
    hintEl.classList.add('faded');
  } else if (!canFullscreen) {
    hintEl.textContent = 'Tip: Share → “Add to Home Screen” for a fullscreen app';
  }

  stage.addEventListener('click', () => {
    hintEl.classList.add('faded');
    if (canFullscreen && !document.fullscreenElement) {
      document.documentElement.requestFullscreen().catch(() => {});
    }
    requestWakeLock();
  });
  setTimeout(() => hintEl.classList.add('faded'), 12000);

  addEventListener('resize', () => (state ? render() : fitText()));
})();
</script>
</body>
</html>
