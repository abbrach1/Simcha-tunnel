<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#131518">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Camp Simcha">
<title>Camp Simcha Arrivals</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 24px;
    padding: 24px;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: #e8eaed;
    background: #131518;
    text-align: center;
  }
  h1 { font-size: clamp(24px, 6vw, 36px); font-weight: 700; }
  p.sub { color: #8b929c; font-size: 16px; max-width: 420px; line-height: 1.5; }
  .roles { display: flex; flex-direction: column; gap: 12px; width: 100%; max-width: 380px; }
  a.role {
    display: block;
    padding: 18px;
    border-radius: 8px;
    text-decoration: none;
    color: inherit;
    background: #1c1f24;
    border: 1px solid #2a2e34;
  }
  a.role:active { background: #272b31; }
  a.role .big { font-size: 20px; font-weight: 700; margin-bottom: 4px; }
  a.role .desc { font-size: 14px; color: #8b929c; line-height: 1.4; }
</style>
</head>
<body>
  <h1>Camp Simcha Arrivals</h1>
  <p class="sub">Pick what this phone should be:</p>
  <div class="roles">
    <a class="role display" href="/display">
      <div class="big">Stage Display</div>
      <div class="desc">The big screen by the stage. Shows each arriving camper's name — the announcer reads from here.</div>
    </a>
    <a class="role dashboard" href="/dashboard">
      <div class="big">Control Dashboard</div>
      <div class="desc">For the person spotting campers. Enter the list of names and tap "Announce next" as each camper comes in.</div>
    </a>
  </div>
</body>
</html>
